<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#58a6ff" />
  <title>Playground Pro</title>

  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Playground%22,%22short_name%22:%22Playground%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%230d1117%22}" />

  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #21262d;
      --editor: #0d1117;
      --text: #c9d1d9;
      --muted: #8b949e;
      --border: #30363d;
      --primary: #58a6ff;
      --success: #3fb950;
      --error: #f85149;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --panel: #f6f8fa;
      --panel-2: #eaeef2;
      --editor: #ffffff;
      --text: #24292f;
      --muted: #57606a;
      --border: #d0d7de;
      --primary: #0969da;
      --success: #1a7f0f;
      --error: #d1242f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 13px;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--primary);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--panel-2);
      border-color: var(--primary);
    }

    .btn.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .btn.danger {
      background: var(--error);
      color: white;
      border-color: var(--error);
    }

    #status {
      padding: 8px 12px;
      background: transparent;
      color: var(--text);
      font-size: 12px;
      min-height: 24px;
    }

    #status.success {
      background: var(--success);
      color: white;
    }

    #status.error {
      background: var(--error);
      color: white;
    }

    .main {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar {
      width: 250px;
      border-right: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 12px;
      color: var(--muted);
    }

    .sidebar-menu {
      flex: 1;
      overflow-y: auto;
      padding: 4px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      margin: 2px 0;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text);
      transition: all 0.2s;
    }

    .menu-item:hover {
      background: var(--panel-2);
    }

    .menu-item.active {
      background: var(--primary);
      color: white;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .page {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: none;
    }

    .page.active {
      display: block;
    }

    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: var(--bg);
    }

    .login-form {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
    }

    .login-form h1 {
      margin: 0 0 20px;
      text-align: center;
      color: var(--primary);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 16px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .form-group input {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--editor);
      color: var(--text);
      font-size: 12px;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .form-buttons {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    .form-buttons button {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--primary);
      color: white;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
    }

    .form-buttons button:hover {
      background: #79c0ff;
    }

    .user-info {
      font-size: 11px;
      color: var(--muted);
      padding: 0 10px;
      margin-top: auto;
      padding-bottom: 10px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 900px) {
      .sidebar {
        width: 200px;
      }
    }

    @media (max-width: 600px) {
      .main {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 120px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .sidebar-menu {
        display: flex;
        gap: 4px;
        overflow-x: auto;
      }

      .menu-item {
        flex-shrink: 0;
      }
    }
  </style>
</head>

<body>
  <!-- PÁGINA DE LOGIN -->
  <div id="loginPage" class="login-page">
    <div class="login-form">
      <h1>🔐 Login</h1>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="seu@email.com" />
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="loginPassword" placeholder="sua senha" />
      </div>

      <div class="form-buttons">
        <button onclick="fazerLogin()">Entrar</button>
        <button onclick="fazerRegistro()">Registrar</button>
      </div>

      <div id="loginStatus" style="margin-top: 16px; text-align: center; font-size: 12px; color: var(--error);"></div>
    </div>
  </div>

  <!-- APP PRINCIPAL -->
  <div id="appPage" class="app" style="display: none;">
    <header class="topbar">
      <div class="brand">
        <span>◆</span>
        <span>Playground Pro</span>
      </div>
      <div class="toolbar">
        <span id="userEmail" style="font-size: 12px; color: var(--muted);"></span>
        <button id="themeBtn" class="btn">☾</button>
        <button id="logoutBtn" class="btn danger">Sair</button>
      </div>
    </header>

    <div id="status" class="status"></div>

    <main class="main">
      <aside class="sidebar">
        <div class="sidebar-header">Menu</div>
        <div class="sidebar-menu">
          <div class="menu-item active" onclick="abrirPagina('inicio')">
            🏠 Início
          </div>
          <div class="menu-item" onclick="abrirPagina('editor')">
            ✏️ Editor
          </div>
          <div class="menu-item" onclick="abrirPagina('playground')">
            🎮 Playground
          </div>
          <div class="menu-item" onclick="abrirPagina('chat')">
            💬 Chat IA
          </div>
          <div class="menu-item" onclick="abrirPagina('projetos')">
            📁 Projetos
          </div>
        </div>
        <div class="user-info" id="userInfo"></div>
      </aside>

      <section class="content">
        <div id="inicio" class="page active">
          <h1>🚀 Bem-vindo ao Playground Pro!</h1>
          <p>Selecione uma opção no menu para começar.</p>
        </div>

        <div id="editor" class="page">
          <h1>✏️ Editor</h1>
          <div id="editorContent"></div>
        </div>

        <div id="playground" class="page">
          <h1>🎮 Playground</h1>
          <div id="playgroundContent"></div>
        </div>

        <div id="chat" class="page">
          <h1>💬 Chat IA</h1>
          <div id="chatContent"></div>
        </div>

        <div id="projetos" class="page">
          <h1>📁 Meus Projetos</h1>
          <div id="projetosContent"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    function $(id) {
      return document.getElementById(id);
    }

    function showStatus(message, type = 'info') {
      const el = $('status');
      el.textContent = message;
      el.className = 'status ' + type;
      setTimeout(() => {
        el.textContent = '';
        el.className = 'status';
      }, 3000);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }

    function applyTheme() {
      const theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    }

    let supabase = null;
    let usuarioAtual = null;

    const SUPABASE_URL = 'https://seu-projeto.supabase.co';
    const SUPABASE_KEY = 'sua-chave-publica';

    function inicializarSupabase() {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    async function fazerLogin() {
      const email = $('loginEmail').value;
      const password = $('loginPassword').value;

      if (!email || !password) {
        $('loginStatus').textContent = '❌ Preencha email e senha';
        return;
      }

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          $('loginStatus').textContent = '❌ ' + error.message;
          return;
        }

        usuarioAtual = data.user;
        localStorage.setItem('user', JSON.stringify(usuarioAtual));
        mostrarApp();
      } catch (error) {
        $('loginStatus').textContent = '❌ Erro: ' + error.message;
      }
    }

    async function fazerRegistro() {
      const email = $('loginEmail').value;
      const password = $('loginPassword').value;

      if (!email || !password) {
        $('loginStatus').textContent = '❌ Preencha email e senha';
        return;
      }

      try {
        const { data, error } = await supabase.auth.signUp({
          email,
          password
        });

        if (error) {
          $('loginStatus').textContent = '❌ ' + error.message;
          return;
        }

        $('loginStatus').textContent = '✅ Registrado! Faça login agora.';
        $('loginEmail').value = '';
        $('loginPassword').value = '';
      } catch (error) {
        $('loginStatus').textContent = '❌ Erro: ' + error.message;
      }
    }

    function mostrarApp() {
      $('loginPage').style.display = 'none';
      $('appPage').style.display = 'flex';
      $('userEmail').textContent = usuarioAtual.email;
      $('userInfo').textContent = `👤 ${usuarioAtual.email}`;
    }

    function fazerLogout() {
      supabase.auth.signOut();
      usuarioAtual = null;
      localStorage.removeItem('user');
      $('loginPage').style.display = 'flex';
      $('appPage').style.display = 'none';
      $('loginEmail').value = '';
      $('loginPassword').value = '';
    }

    function abrirPagina(pagina) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));

      $(pagina).classList.add('active');
      event.target.closest('.menu-item').classList.add('active');
    }

    $('themeBtn').addEventListener('click', toggleTheme);
    $('logoutBtn').addEventListener('click', fazerLogout);

    document.addEventListener('DOMContentLoaded', async () => {
      applyTheme();
      inicializarSupabase();

      const user = localStorage.getItem('user');
      if (user) {
        usuarioAtual = JSON.parse(user);
        mostrarApp();
      }
    });
  </script>
</body>
</html>
