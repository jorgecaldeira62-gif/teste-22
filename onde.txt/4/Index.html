<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SK Mini Editor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
      background: #0d1117;
      color: #c9d1d9;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    /* HEADER */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      padding: 0 1rem;
      gap: 1rem;
      z-index: 100;
    }

    .header h1 {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header i {
      color: #58a6ff;
      font-size: 1.25rem;
    }

    .header-buttons {
      margin-left: auto;
      display: flex;
      gap: 0.5rem;
    }

    .btn {
      padding: 0.5rem 0.75rem;
      background: #1f6feb;
      border: none;
      border-radius: 0.375rem;
      color: white;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #388bfd;
    }

    .btn.secondary {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
    }

    .btn.secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* MAIN */
    .main {
      display: flex;
      margin-top: 50px;
      height: calc(100vh - 50px);
    }

    /* SIDEBAR */
    .sidebar {
      width: 280px;
      background: #161b22;
      border-right: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header h2 {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #8b949e;
    }

    .sidebar-header button {
      background: none;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 1rem;
    }

    .sidebar-header button:hover {
      color: #c9d1d9;
    }

    .files-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .file-item {
      padding: 0.75rem;
      margin: 0.25rem 0;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 0.375rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      user-select: none;
    }

    .file-item:hover {
      background: rgba(31, 111, 235, 0.1);
      border-color: #1f6feb;
      color: #58a6ff;
    }

    .file-item.active {
      background: #1f6feb;
      border-color: #1f6feb;
      color: white;
      font-weight: 600;
    }

    .file-icon {
      font-size: 0.75rem;
      width: 1rem;
      text-align: center;
    }

    .file-icon.html { color: #fb8500; }
    .file-icon.css { color: #b77dff; }
    .file-icon.js { color: #ffd60a; }

    /* EDITOR SECTION */
    .editor-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0d1117;
      overflow: hidden;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      padding: 0.5rem;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .tab {
      padding: 0.5rem 0.75rem;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 0.375rem 0.375rem 0 0;
      cursor: pointer;
      font-size: 0.875rem;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #8b949e;
      transition: all 0.2s;
    }

    .tab:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #c9d1d9;
    }

    .tab.active {
      background: #1f6feb;
      border-color: #1f6feb;
      color: white;
      font-weight: 600;
    }

    .tab-close {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .tab-close:hover {
      opacity: 1;
    }

    .editor-container {
      flex: 1;
      display: flex;
      gap: 1px;
      background: #30363d;
      overflow: hidden;
    }

    .code-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0d1117;
      overflow: hidden;
    }

    .code-editor {
      flex: 1;
      padding: 1rem;
      background: #0d1117;
      color: #c9d1d9;
      border: none;
      outline: none;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      resize: none;
      tab-size: 2;
      overflow-y: auto;
    }

    .code-editor::selection {
      background: rgba(31, 111, 235, 0.5);
    }

    .code-editor::-webkit-scrollbar {
      width: 8px;
    }

    .code-editor::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 4px;
    }

    /* PREVIEW SECTION */
    .preview-section {
      width: 50%;
      display: flex;
      flex-direction: column;
      background: #0d1117;
      border-left: 1px solid #30363d;
      overflow: hidden;
    }

    .preview-header {
      padding: 0.75rem 1rem;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      font-size: 0.875rem;
      font-weight: 600;
      color: #c9d1d9;
    }

    .preview-content {
      flex: 1;
      overflow: auto;
      background: #0d1117;
      padding: 1rem;
    }

    .preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

    .preview-code {
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      border-radius: 0.375rem;
      overflow: auto;
    }

    .preview-code code {
      display: block;
      padding: 1rem;
    }

    .hljs {
      background: #0d1117 !important;
      color: #c9d1d9 !important;
    }

    .hljs-tag { color: #79c0ff; }
    .hljs-attr { color: #79c0ff; }
    .hljs-string { color: #a5d6ff; }
    .hljs-number { color: #79c0ff; }
    .hljs-literal { color: #79c0ff; }
    .hljs-attr-string { color: #a5d6ff; }
    .hljs-property { color: #79c0ff; }
    .hljs-selector-tag { color: #ff7b72; }
    .hljs-selector-class { color: #79c0ff; }
    .hljs-selector-id { color: #79c0ff; }
    .hljs-selector-attr { color: #79c0ff; }
    .hljs-keyword { color: #ff7b72; }
    .hljs-function { color: #d2a8ff; }
    .hljs-comment { color: #8b949e; }
    .hljs-built_in { color: #ffa657; }

    .status {
      padding: 0.5rem 1rem;
      background: #161b22;
      border-top: 1px solid #30363d;
      font-size: 0.75rem;
      color: #8b949e;
    }

    @media (max-width: 1200px) {
      .preview-section {
        display: none;
      }
    }

    #importInput {
      display: none;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <div class="header">
    <h1><i class="fas fa-code"></i> SK Mini Editor</h1>
    <div class="header-buttons">
      <button class="btn secondary" id="importBtn" title="Importar arquivo ou ZIP">
        <i class="fas fa-upload"></i> Importar
      </button>
      <button class="btn secondary" id="exportBtn" title="Exportar como ZIP">
        <i class="fas fa-download"></i> Exportar
      </button>
      <button class="btn secondary" id="githubBtn" title="GitHub">
        <i class="fab fa-github"></i> GitHub
      </button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>📁 Arquivos</h2>
        <button id="newFileBtn" title="Novo arquivo">
          <i class="fas fa-plus"></i>
        </button>
      </div>
      <div class="files-list" id="filesList"></div>
    </div>

    <!-- EDITOR -->
    <div class="editor-section">
      <div class="tabs" id="tabs"></div>
      <div class="editor-container">
        <div class="code-section">
          <textarea 
            id="codeEditor" 
            class="code-editor" 
            spellcheck="false"
            placeholder="Selecione um arquivo..."
          ></textarea>
        </div>
        <div class="preview-section">
          <div class="preview-header">📺 Preview com Cores</div>
          <div class="preview-content" id="previewContent">
            <div id="previewFrame" class="preview-frame"></div>
            <pre id="previewCode" class="preview-code"><code id="previewCodeContent"></code></pre>
          </div>
        </div>
      </div>
      <div class="status" id="status">Pronto</div>
    </div>
  </div>

  <input type="file" id="importInput" accept=".zip,.html,.css,.js,.json,.md,.txt,.py,.rb,.go,.rs,.java,.xml,.yaml,.yml,.ts,.jsx,.tsx,.scss">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/file-saver/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script>
    const files = {};
    const tabs = new Set();
    let currentFile = null;

    function getFileIcon(name) {
      const ext = name.split('.').pop().toLowerCase();
      const icons = {
        'html': { icon: 'file-code', class: 'html' },
        'css': { icon: 'file-code', class: 'css' },
        'js': { icon: 'file-code', class: 'js' },
        'json': { icon: 'file-code', class: 'js' },
        'md': { icon: 'file-alt', class: 'text' },
        'txt': { icon: 'file-alt', class: 'text' }
      };
      return icons[ext] || { icon: 'file', class: 'text' };
    }

    function addFile(name, content) {
      files[name] = content;
      renderFiles();
    }

    function renderFiles() {
      const list = document.getElementById('filesList');
      list.innerHTML = Object.keys(files).map(name => {
        const { icon, class: iconClass } = getFileIcon(name);
        return `
          <div class="file-item ${currentFile === name ? 'active' : ''}" onclick="selectFile('${name}')">
            <i class="fas fa-${icon} file-icon ${iconClass}"></i>
            <span>${name}</span>
          </div>
        `;
      }).join('');
    }

    function selectFile(name) {
      currentFile = name;
      tabs.add(name);
      document.getElementById('codeEditor').value = files[name];
      renderFiles();
      renderTabs();
      updatePreview();
    }

    function renderTabs() {
      const tabsDiv = document.getElementById('tabs');
      tabsDiv.innerHTML = Array.from(tabs).map(name => `
        <div class="tab ${currentFile === name ? 'active' : ''}">
          <span onclick="selectFile('${name}')" style="cursor: pointer;">${name}</span>
          <button class="tab-close" onclick="closeTab('${name}', event)">✕</button>
        </div>
      `).join('');
    }

    function closeTab(name, event) {
      event.stopPropagation();
      tabs.delete(name);
      if (currentFile === name) {
        currentFile = Array.from(tabs)[0] || null;
      }
      renderTabs();
      if (currentFile) selectFile(currentFile);
    }

    function updateFile() {
      if (currentFile) {
        files[currentFile] = document.getElementById('codeEditor').value;
        updatePreview();
      }
    }

    function updatePreview() {
      if (!currentFile) return;
      const content = files[currentFile];
      const ext = currentFile.split('.').pop().toLowerCase();

      document.getElementById('previewFrame').style.display = 'none';
      document.getElementById('previewCode').style.display = 'none';

      if (ext === 'html') {
        document.getElementById('previewFrame').style.display = 'block';
        document.getElementById('previewFrame').innerHTML = `<iframe srcdoc="${content.replace(/"/g, '&quot;')}" style="width:100%; height:100%; border:none;"></iframe>`;
      } else {
        document.getElementById('previewCode').style.display = 'block';
        const codeElement = document.getElementById('previewCodeContent');
        codeElement.textContent = content;
        codeElement.className = `language-${ext}`;
        hljs.highlightElement(codeElement);
      }
    }

    document.getElementById('codeEditor').addEventListener('input', updateFile);

    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importInput').click();
    });

    document.getElementById('importInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const ext = file.name.split('.').pop().toLowerCase();

      if (ext === 'zip') {
        try {
          const zip = new JSZip();
          const loaded = await zip.loadAsync(file);
          for (const [path, zipFile] of Object.entries(loaded.files)) {
            if (!zipFile.dir) {
              const content = await zipFile.async('text');
              addFile(path.split('/').pop(), content);
            }
          }
          document.getElementById('status').textContent = `✓ ZIP importado com sucesso!`;
        } catch (error) {
          document.getElementById('status').textContent = `❌ Erro ao importar ZIP`;
        }
      } else {
        const content = await file.text();
        addFile(file.name, content);
        document.getElementById('status').textContent = `✓ ${file.name} importado!`;
      }

      e.target.value = '';
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      const zip = new JSZip();
      for (const [name, content] of Object.entries(files)) {
        zip.file(name, content);
      }
      zip.generateAsync({ type: 'blob' }).then(blob => {
        saveAs(blob, 'projeto.zip');
        document.getElementById('status').textContent = '✓ Exportado como ZIP!';
      });
    });

    document.getElementById('githubBtn').addEventListener('click', () => {
      alert('GitHub será implementado em breve!');
    });

    document.getElementById('newFileBtn').addEventListener('click', () => {
      const name = prompt('Nome do arquivo:');
      if (name) {
        addFile(name, '');
        selectFile(name);
      }
    });

    addFile('index.html', '<!DOCTYPE html>\n<html>\n<head>\n  <title>SK Mini Editor</title>\n  <style>\n    body { font-family: Arial; background: #f0f0f0; }\n    h1 { color: #1f6feb; }\n  </style>\n</head>\n<body>\n  <h1>Olá! 👋</h1>\n  <p>SK Mini Editor funcionando!</p>\n</body>\n</html>');
    addFile('style.css', 'body {\n  font-family: Arial, sans-serif;\n  background: #f0f0f0;\n  margin: 0;\n  padding: 20px;\n}\n\nh1 {\n  color: #1f6feb;\n  font-size: 2rem;\n}\n\np {\n  color: #333;\n  line-height: 1.6;\n}');
    addFile('script.js', 'console.log("SK Mini Editor rodando!");\n\nfunction teste() {\n  console.log("Função funcionando!");\n}\n\nteste();');

    selectFile('index.html');
  </script>
</body>
</html>
